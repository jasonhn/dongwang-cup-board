name: Refresh and deploy 内战看板

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/pages.yml"
      - "site/**"
      - "collector.py"
      - "requirements.txt"
      - "config.json"
      - "names.json"
      - "matches.txt"
      - "tests/**"
  schedule:
    # 每天 UTC 01:00，也就是北京时间 09:00。GitHub cron 用 UTC，改时间时记得换算。
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: dota2-internal-league-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run collector tests
        run: python -m pytest -q

      - name: Refresh OpenDota league data
        env:
          OPENDOTA_API_KEY: ${{ secrets.OPENDOTA_API_KEY }}
          OPENDOTA_MAX_PAID_CALLS: "250"
        run: >-
          python collector.py --config config.json

      - name: Persist refreshed data
        run: |
          if git diff --quiet -- "$(python -c "import json;print(json.load(open('config.json'))['output'])")"; then
            echo "League data is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$(python -c "import json;print(json.load(open('config.json'))['output'])")"
          git commit -m "Refresh league dashboard data"
          git push

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

